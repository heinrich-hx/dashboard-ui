<div class="flex justify-end m-4 gap-4">
  <db-button type="blank" routerLink="/settings">
    <db-icon icon="cog"></db-icon>
  </db-button>
  <db-button type="blank" routerLink="/user">
    <db-icon icon="user"></db-icon>
  </db-button>
</div>

<db-container class="mb-24">
  @if ($dashboard | async; as dashboard) {

    <div class="flex gap-4">
      @for (link of dashboard.top; track link.uuid) {
        <db-link [link]="link"></db-link>
      }
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 my-6">
      @for (panel of dashboard.panels; track panel.uuid) {
        <db-panel>
          <db-heading [level]="2">
            @if (panel.icon) {
              <db-icon [icon]="panel.icon" class="align-middle mr-2 text-red-500"></db-icon>
            }
            <span class="align-middle">{{ panel.label }}</span>
          </db-heading>
          <ul class="list-disc ml-4">
            @for (link of panel.links; track link.uuid) {
              <li>
                <db-link [link]="link"></db-link>
              </li>
            }
          </ul>
        </db-panel>
      }
    </div>

  }
</db-container>
